version: 2

project_name: observoor

before:
  hooks:
    - cargo --version

builds:
  - id: observoor
    builder: rust
    binary: observoor
    # The glibc suffix sets the minimum glibc the binaries need, independent of
    # the build host.
    targets:
      - x86_64-unknown-linux-gnu.2.28
      - aarch64-unknown-linux-gnu.2.28
    env:
      - GIT_COMMIT={{ .FullCommit }}

checksum:
  name_template: 'checksums.txt'

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'

dockers:
  # Debian images only - required for eBPF compatibility
  - use: buildx
    goos: linux
    goarch: amd64
    dockerfile: goreleaser-debian.Dockerfile
    image_templates:
      - "ghcr.io/ethpandaops/{{ .ProjectName }}:{{ .Version }}-amd64"
      - "ghcr.io/ethpandaops/{{ .ProjectName }}:{{ if .Env.RELEASE_SUFFIX }}{{ .Env.RELEASE_SUFFIX }}-{{ end }}latest-amd64"
    build_flag_templates:
      - "--platform=linux/amd64"
      - "--provenance=false"
      - "--sbom=false"
      - "--label=org.opencontainers.image.created={{.Date}}"
      - "--label=org.opencontainers.image.title={{.ProjectName}}"
      - "--label=org.opencontainers.image.revision={{.FullCommit}}"
      - "--label=org.opencontainers.image.version={{.Version}}"

  - use: buildx
    goos: linux
    goarch: arm64
    dockerfile: goreleaser-debian.Dockerfile
    image_templates:
      - "ghcr.io/ethpandaops/{{ .ProjectName }}:{{ .Version }}-arm64v8"
      - "ghcr.io/ethpandaops/{{ .ProjectName }}:{{ if .Env.RELEASE_SUFFIX }}{{ .Env.RELEASE_SUFFIX }}-{{ end }}latest-arm64v8"
    build_flag_templates:
      - "--platform=linux/arm64/v8"
      - "--provenance=false"
      - "--sbom=false"
      - "--label=org.opencontainers.image.created={{.Date}}"
      - "--label=org.opencontainers.image.title={{.ProjectName}}"
      - "--label=org.opencontainers.image.revision={{.FullCommit}}"
      - "--label=org.opencontainers.image.version={{.Version}}"

docker_manifests:
  - name_template: ghcr.io/ethpandaops/{{ .ProjectName }}:{{ .Version }}
    image_templates:
      - ghcr.io/ethpandaops/{{ .ProjectName }}:{{ .Version }}-amd64
      - ghcr.io/ethpandaops/{{ .ProjectName }}:{{ .Version }}-arm64v8

  - name_template: ghcr.io/ethpandaops/{{ .ProjectName }}:{{ .Version }}-arm64
    image_templates:
      - ghcr.io/ethpandaops/{{ .ProjectName }}:{{ .Version }}-arm64v8

  - name_template: ghcr.io/ethpandaops/{{ .ProjectName }}:{{ if .Env.RELEASE_SUFFIX }}{{ .Env.RELEASE_SUFFIX }}-{{ end }}latest
    image_templates:
      - ghcr.io/ethpandaops/{{ .ProjectName }}:{{ if .Env.RELEASE_SUFFIX }}{{ .Env.RELEASE_SUFFIX }}-{{ end }}latest-amd64
      - ghcr.io/ethpandaops/{{ .ProjectName }}:{{ if .Env.RELEASE_SUFFIX }}{{ .Env.RELEASE_SUFFIX }}-{{ end }}latest-arm64v8
